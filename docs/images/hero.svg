<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="NPXUI — 一行 npx 把开源 UI 源码注入你的项目">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="1" stop-color="#141417"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <text x="640" y="166" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="104" font-weight="800" letter-spacing="8" fill="#fafafa">NPXUI</text>

  <rect x="556" y="190" width="168" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="640" y="240" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="23" fill="#a1a1aa">开源 UI 组件注册表 · React 与 Vue 3 双生态</text>

  <rect x="300" y="274" width="680" height="60" rx="12" fill="#18181b" stroke="#27272a"/>
  <circle cx="332" cy="304" r="5" fill="#3f3f46"/>
  <circle cx="352" cy="304" r="5" fill="#3f3f46"/>
  <circle cx="372" cy="304" r="5" fill="#3f3f46"/>
  <text x="402" y="311" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" fill="#52525b">$</text>
  <text x="426" y="311" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" fill="#e4e4e7">npx npxui add <tspan fill="#a5b4fc">@alice/glow-button</tspan></text>

  <text x="640" y="382" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="17" fill="#52525b">源码注入你的项目，而不是装一个黑盒依赖</text>
</svg>
